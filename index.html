<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>WORLD CUTTER 3D</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07120a;
    }

    body {
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07120a;
      color: white;
      font-size: 22px;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="loading">WORLD CUTTER 3D</div>

  <canvas id="game"></canvas>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
